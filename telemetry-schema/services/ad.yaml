file_format: definition/2
attribute_groups:
  - id: service.ad
    visibility: public
    brief: Ad service attributes
    stability: stable
    attributes:
      - ref: demo.ad.context_keys
      - ref: demo.ad.context_keys.count
      - ref: demo.ad.count
      - ref: demo.ad.request_type
      - ref: demo.ad.response_type
      - ref: demo.ad.category
      - ref: session.id
      - ref: enduser.id
      - ref: demo.ad.profile.level
      - ref: demo.ad.profile.cpu_time
      - ref: demo.ad.profile.cost
      - ref: demo.ad.auction.bidders.count
      - ref: demo.ad.auction.bids.count
      - ref: demo.ad.auction.winner
      - ref: demo.ad.auction.winning_bid
      - ref: demo.ad.auction.loss
