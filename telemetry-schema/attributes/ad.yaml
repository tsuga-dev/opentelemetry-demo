file_format: definition/2
attributes:
  - key: demo.ad.category
    type: string
    brief: Advertisement category
    stability: stable
    note: The category of advertisements being served
    examples: ["electronics", "clothing", "home"]
  - key: demo.ad.count
    type: int
    brief: Number of advertisements served
    stability: stable
    note: The count of advertisements returned or served in a request
    examples: [1, 2, 5]
  - key: demo.ad.context_keys
    type: string
    brief: Context keys for ad targeting
    stability: stable
    note: Comma-separated list of context keys used for ad targeting
    examples: ["electronics,gadgets", "home,kitchen"]
  - key: demo.ad.context_keys.count
    type: int
    brief: Number of context keys
    stability: stable
    note: The count of context keys provided for ad targeting
    examples: [0, 2, 5]
  - key: demo.ad.request_type
    type: string
    brief: Type of ad request
    stability: stable
    note: Indicates whether the ad request was targeted or not
    examples: ["TARGETED", "NOT_TARGETED"]
  - key: demo.ad.response_type
    type: string
    brief: Type of ad response
    stability: stable
    note: Indicates whether the ad response was targeted or random
    examples: ["TARGETED", "RANDOM"]
  - key: demo.ad.profile.level
    type: string
    brief: Visitor profile enrichment level
    stability: development
    note: The profile level applied to the ad request, derived from the adProfileLevel feature flag
    examples: ["low", "extreme"]
  - key: demo.ad.profile.cpu_time
    type: double
    brief: CPU time spent building the visitor profile
    stability: development
    note: CPU time in seconds spent by the ad service building the visitor profile for the request
    examples: [0.002, 0.05]
  - key: demo.ad.profile.cost
    type: double
    brief: Cost of building the visitor profile
    stability: development
    note: Cost in USD of the CPU time spent building the visitor profile, computed from AD_PROFILE_COST_PER_CPU_SECOND
    examples: [0.0003, 0.0075]
  - key: demo.ad.auction.bidders.count
    type: int
    brief: Number of bidders in the ad auction
    stability: development
    note: The count of bidder services invited to the ad auction
    examples: [0, 3]
  - key: demo.ad.auction.bids.count
    type: int
    brief: Number of bids received in the ad auction
    stability: development
    note: The count of valid bids received before the auction deadline
    examples: [0, 2]
  - key: demo.ad.auction.winner
    type: string
    brief: Winning bidder of the ad auction
    stability: development
    note: The name of the bidder that won the ad auction, or an empty string when the spot was unsold
    examples: ["bidder-astro", ""]
  - key: demo.ad.auction.winning_bid
    type: double
    brief: Winning bid of the ad auction
    stability: development
    note: The winning bid amount in USD, or 0 when the spot was unsold
    examples: [0.0, 0.0034]
  - key: demo.ad.auction.loss
    type: boolean
    brief: Whether the ad auction was lost
    stability: development
    note: True when the auction did not produce a winning bid for the ad spot
    examples: [true, false]
