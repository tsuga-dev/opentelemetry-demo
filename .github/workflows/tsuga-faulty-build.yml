name: "Build Faulty Images"

on:
  push:
    branches: [faulty]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_faulty:
    permissions:  # required by the reusable workflow
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/tsuga-component-build-images.yml
    with:
      push: true
      publish_latest: false
      version: faulty-v3
      # Only the services that carry a fault patch on this branch. Everything
      # else in the shared matrix is identical to the healthy build, so
      # rebuilding it here just burns runners and lets an unrelated service
      # fail the faulty run. Derive with:
      #   git diff --name-only <upstream-sync> faulty -- src/ | cut -d/ -f2 | sort -u
      # Keep in sync with demo-gitops fault/services.yaml.
      only_suffixes: >-
        accounting ad cart checkout currency email fraud-detection frontend
        payment product-catalog quote recommendation shipping
    secrets: inherit
