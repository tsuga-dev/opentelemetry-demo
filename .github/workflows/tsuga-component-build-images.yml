on:
  workflow_dispatch:
    inputs:
      push:
        description: Should the images be pushed
        default: false
        required: false
        type: boolean
      publish_latest:
        description: Also publish latest-<service> aliases
        default: true
        required: false
        type: boolean
      version:
        description: The version used when tagging the image
        default: 'dev'
        required: false
        type: string
      dockerhub_repo:
        description: Docker Hub repository
        default: 'otel/demo'
        required: false
        type: string
      ghcr_repo:
        description: GHCR repository
        default: 'ghcr.io/tsuga-dev/otel-demo'
        required: false
        type: string
  workflow_call:
    inputs:
      push:
        description: Should the images be pushed
        default: false
        required: false
        type: boolean
      publish_latest:
        description: Also publish latest-<service> aliases
        default: true
        required: false
        type: boolean
      version:
        description: The version used when tagging the image
        default: 'dev'
        required: false
        type: string
      dockerhub_repo:
        description: Docker Hub repository
        default: 'otel/demo'
        required: false
        type: string
      ghcr_repo:
        description: GHCR repository
        default: 'ghcr.io/tsuga-dev/otel-demo'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: "eu-central-1"
  ECR_REPOSITORY: "tsuga-dev/otel-demo"

jobs:
  protobufcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Generate
        run: make clean docker-generate-protobuf
      - name: Check Clean Work Tree
        run: make check-clean-work-tree

  build_and_push_images:
    runs-on: ubuntu-latest
    needs: protobufcheck

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      RELEASE_VERSION: "${{ github.event.release.tag_name }}"

    strategy:
      fail-fast: false
      matrix:
        file_tag:
          - file: ./src/accounting/Dockerfile
            tag_suffix: accounting
            context: ./
            setup-qemu: true
          - file: ./src/ad/Dockerfile
            tag_suffix: ad
            context: ./
            setup-qemu: true
          - file: ./src/agent/Dockerfile
            tag_suffix: agent
            context: ./
            setup-qemu: true
          - file: ./src/cart/src/Dockerfile
            tag_suffix: cart
            context: ./
            setup-qemu: false
          - file: ./src/chatbot/Dockerfile
            tag_suffix: chatbot
            context: ./
            setup-qemu: true
          - file: ./src/checkout/Dockerfile
            tag_suffix: checkout
            context: ./
            setup-qemu: true
          - file: ./src/currency/Dockerfile
            tag_suffix: currency
            context: ./
            setup-qemu: true
          - file: ./src/email/Dockerfile
            tag_suffix: email
            context: ./
            setup-qemu: true
          - file: ./src/flagd-ui/Dockerfile
            tag_suffix: flagd-ui
            context: ./
            setup-qemu: true
          - file: ./src/fraud-detection/Dockerfile
            tag_suffix: fraud-detection
            context: ./
            setup-qemu: true
          - file: ./src/frontend/Dockerfile
            tag_suffix: frontend
            context: ./
            setup-qemu: true
          - file: ./src/frontend-proxy/Dockerfile
            tag_suffix: frontend-proxy
            context: ./
            setup-qemu: true
          - file: ./src/frontend/Dockerfile.cypress
            tag_suffix: frontend-tests
            context: ./
            setup-qemu: true
          - file: ./src/image-provider/Dockerfile
            tag_suffix: image-provider
            context: ./
            setup-qemu: true
          - file: ./src/kafka/Dockerfile
            tag_suffix: kafka
            context: ./
            setup-qemu: true
          - file: ./src/load-generator/Dockerfile
            tag_suffix: load-generator
            context: ./
            setup-qemu: true
          - file: ./src/opamp-server/Dockerfile
            tag_suffix: opamp-server
            context: ./
            setup-qemu: true
          - file: ./src/mcp/Dockerfile
            tag_suffix: mcp
            context: ./
            setup-qemu: true
          - file: ./src/opensearch/Dockerfile
            tag_suffix: opensearch
            context: ./
            setup-qemu: true
          - file: ./src/payment/Dockerfile
            tag_suffix: payment
            context: ./
            setup-qemu: true
          - file: ./src/product-catalog/Dockerfile
            tag_suffix: product-catalog
            context: ./
            setup-qemu: true
          - file: ./src/quote/Dockerfile
            tag_suffix: quote
            context: ./
            setup-qemu: true
          - file: ./src/recommendation/Dockerfile
            tag_suffix: recommendation
            context: ./
            setup-qemu: true
          - file: ./src/shipping/Dockerfile
            tag_suffix: shipping
            context: ./
            setup-qemu: true
          - file: ./src/telemetry-docs/Dockerfile
            tag_suffix: telemetry-docs
            context: ./
            setup-qemu: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load environment variables from .env file
        run: |
          if [ -f .env ]; then
            # Filter out comments and empty lines, then add each variable to $GITHUB_ENV
            grep -vE '^\s*#|^\s*$' .env | while read -r line; do
              echo "$line" >> "$GITHUB_ENV"
            done
          else
            echo ".env file not found!"
            exit 1
          fi
      - name: Check for changes and set push options
        id: check_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCKERFILE: ${{ matrix.file_tag.file }}
          FORCE_PUSH: ${{ inputs.push }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$FORCE_PUSH" = true ]; then
            echo "Force push is enabled, proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base SHA is available, proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOCKERFILE_DIR=$(dirname "$DOCKERFILE")
          FILES_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$DOCKERFILE_DIR")
          if [ -z "$FILES_CHANGED" ]; then
            echo "No changes in ${{ matrix.file_tag.context }}, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in ${{ matrix.file_tag.context }}, proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: arn:aws:iam::259033777210:role/demo-services-github
          aws-region: ${{ env.AWS_REGION }}
        if: ${{ inputs.push }}
      # The ECR repo is not Pulumi-managed — the push role is scoped to the
      # tsuga-dev/* namespace so this workflow provisions it on first push.
      - name: Ensure ECR repository exists
        if: ${{ inputs.push }}
        env:
          REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1; then
            exit 0
          fi
          # Matrix jobs run in parallel and can race; losing the race is fine as
          # long as the repo exists afterwards. Tags stay mutable (unlike the
          # demo-services repos) because every build also pushes `latest-<suffix>`.
          aws ecr create-repository --repository-name "$REPO" >/dev/null \
            || aws ecr describe-repositories --repository-names "$REPO" >/dev/null
          aws ecr put-lifecycle-policy \
            --repository-name "$REPO" \
            --lifecycle-policy-text '{
              "rules": [{
                "rulePriority": 1,
                "description": "Expire untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              }]
            }' >/dev/null
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1
        if: ${{ inputs.push }}
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ inputs.push }}
      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ inputs.push && !github.event.repository.fork }}
      - name: Set up QEMU
        if: ${{ matrix.file_tag.setup-qemu }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          image: tonistiigi/binfmt:master
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
            max-parallelism = 2
      - name: Set image tags
        id: image-tags
        if: steps.check_changes.outputs.skip == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GHCR_REPOSITORY: ${{ inputs.ghcr_repo }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          TAG_SUFFIX: ${{ matrix.file_tag.tag_suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo 'tags<<EOF'
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${VERSION}-${TAG_SUFFIX}"
            fi
            echo "${GHCR_REPOSITORY}:${VERSION}-${TAG_SUFFIX}"
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              if [ -n "${ECR_REGISTRY}" ]; then
                echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest-${TAG_SUFFIX}"
              fi
              echo "${GHCR_REPOSITORY}:latest-${TAG_SUFFIX}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Matrix Build and push demo images
        if: steps.check_changes.outputs.skip == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: ${{ matrix.file_tag.context }}
          file: ${{ matrix.file_tag.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha
